services:
  service:
    mem_limit: 768m
    cpus: 1.0
    build: .
    env_file: .env
    ports: ["127.0.0.1:9704:8000"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://aignite:aignite@db:5432/triage
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    restart: unless-stopped
  db:
    mem_limit: 512m
    cpus: 0.75
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: aignite, POSTGRES_PASSWORD: aignite, POSTGRES_DB: triage}
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aignite -d triage"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  redis:
    mem_limit: 192m
    cpus: 0.25
    image: redis:7
    restart: unless-stopped
volumes:
  dbdata:
