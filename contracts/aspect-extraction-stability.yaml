# Seismograph behavioral contract for Triage's LLM aspect-extraction stage.
# Lives in this repo (contracts version with the prompts they protect) and validates
# against Seismograph's contract DSL. Executed today by scripts/eval_llm.py (key-gated);
# execution via Seismograph's own runner arrives with its Phase 2 HTTP SUT adapter.
contract: triage-aspect-extraction-stability
subject: aspect-extractor
invariants:
  # Compared on canonicalized aspect anchors, not the model's invented labels: naming
  # varies across paraphrases even when the aspects are identical (the CareerCompiler
  # FAIL-0003 observation, inherited as a design rule here).
  - field: aspect_anchors
    under: [paraphrase, repeat_run]
    relation: jaccard_at_least
    threshold: 0.6
allowed_variation:
  - field: label_wording
    rule: semantically_equivalent
run_policy: {samples: 3, configs: 1, confidence: 0.9}
gate: {max_decision_flip_rate: 0.4}
probes:
  - id: feedback-checkout-coupon
    input: |
      Checkout crashes every time I apply a coupon code on iOS. Also sync to my
      laptop is painfully slow since the last update, and I was double charged
      on billing this month.
